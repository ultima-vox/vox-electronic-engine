name: suite

# ULTIMA VOX MUSIC standalone plugins (FOUND-01). Builds only the suite
# (VOX_BUILD_LEGACY=OFF), runs the CTest label "suite", runs the Steinberg
# VST3 validator on all three bundles and publishes the bundles with SHA-256.
# The legacy engine keeps its own workflow (build.yml), unchanged.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [next/standalone-suite]
  workflow_dispatch:

# Cancel obsolete runs for the same PR and workflow (does not clear existing queue).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-suite:
    # FX draft PR — heavy Windows gate is manual until the integrated candidate.
    # Other PRs and protected branch pushes keep their existing CI behavior.
    # Regular FX Draft synchronizations stay skipped. To run exact-head suite
    # while keeping Draft/HOLD, add [RUN_FX_SUITE] to PR #156 description.
    # It triggers only on the addition (an edited-body event), not future pushes.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.action != 'edited' &&
          !(github.event.pull_request.draft && github.head_ref == 'arena/d9776bd9-vox-electronic-engine')) ||
        (github.event.action == 'edited' &&
          github.head_ref == 'arena/d9776bd9-vox-electronic-engine' &&
          github.event.changes.body.from != null &&
          !contains(github.event.changes.body.from, '[RUN_FX_SUITE]') &&
          contains(github.event.pull_request.body, '[RUN_FX_SUITE]'))
      }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    env:
      # FX-only diagnostics; does not change job eligibility or other products.
      FX_DIAGNOSTICS: ${{ github.event_name == 'pull_request' && github.head_ref == 'arena/d9776bd9-vox-electronic-engine' && 'ON' || 'OFF' }}
      CMAKE_GENERATOR: Visual Studio 17 2022
      # Reviewed dependency pins. A tag can move; these commits cannot.
      JUCE_REPOSITORY: https://github.com/juce-framework/JUCE.git
      JUCE_COMMIT: e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8   # JUCE 9.0.1
      VST3SDK_REPOSITORY: https://github.com/steinbergmedia/vst3sdk.git
      VST3SDK_TAG: v3.8.0_build_66                             # SDK bundled by JUCE 9.0.1
      VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Infrastructure: FetchContent's JUCE clone broke off repeatedly on this
      # runner. Use verified copies of the pinned commits from the runner tool
      # cache (fetched with retries only when missing); CMake re-verifies JUCE.
      - name: Provide verified JUCE and VST3 SDK copies
        shell: powershell
        run: |
          $juce = & .github\scripts\Use-PinnedCheckout.ps1 -Name juce -Repository $env:JUCE_REPOSITORY -Ref 9.0.1 -Commit $env:JUCE_COMMIT
          if (-not $juce) { exit 1 }
          $sdk = & .github\scripts\Use-PinnedCheckout.ps1 -Name vst3sdk -Repository $env:VST3SDK_REPOSITORY -Ref $env:VST3SDK_TAG -Commit $env:VST3SDK_COMMIT -Submodules base,pluginterfaces,public.sdk,cmake
          if (-not $sdk) { exit 1 }
          "JUCE_DIR=$juce" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VST3SDK_DIR=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the Steinberg VST3 validator (cached per SDK commit)
        shell: powershell
        run: |
          $build = Join-Path $env:RUNNER_TOOL_CACHE "vox-pinned\vst3sdk-build-$($env:VST3SDK_COMMIT.Substring(0, 12))"
          $validator = Join-Path $build 'bin\Release\validator.exe'
          if (-not (Test-Path $validator)) {
            cmake -S $env:VST3SDK_DIR -B $build -A x64 -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $build --config Release --target validator --parallel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "VST3_VALIDATOR=$validator" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure (suite only)
        shell: powershell
        run: |
          cmake -S . -B build-suite -A x64 -DVOX_BUILD_SUITE=ON -DVOX_BUILD_LEGACY=OFF -DVOX_STRICT_DEPENDENCIES=ON "-DFETCHCONTENT_SOURCE_DIR_JUCE=$env:JUCE_DIR" "-DVOX_FX_DIAGNOSTIC_SYMBOLS=$env:FX_DIAGNOSTICS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build-suite --config Release --clean-first --parallel

      - name: Test (label suite)
        id: suite-ctest
        shell: powershell
        run: |
          # Golden renders are also written as WAV files for listening (artifact).
          New-Item -ItemType Directory -Force -Path suite-out\golden | Out-Null
          $env:VOX_GOLDEN_OUT = (Resolve-Path suite-out\golden).Path
          if ($env:FX_DIAGNOSTICS -eq 'ON') {
            New-Item -ItemType Directory -Force -Path suite-out\ctest | Out-Null
            $report = (Resolve-Path suite-out\ctest).Path
            ctest --test-dir build-suite -C Release -L suite --output-on-failure --output-junit (Join-Path $report 'results.xml')
            exit $LASTEXITCODE
          }
          ctest --test-dir build-suite -C Release -L suite --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve FX CTest text logs
        if: ${{ always() && !cancelled() && steps.suite-ctest.outcome != 'skipped' && env.FX_DIAGNOSTICS == 'ON' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path suite-out\ctest | Out-Null
          foreach ($file in 'LastTest.log','LastTestsFailed.log') {
            $source = Join-Path 'build-suite\Testing\Temporary' $file
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination suite-out\ctest }
          }

      - name: Capture failed FX processor test only
        if: ${{ failure() && steps.suite-ctest.outcome == 'failure' && env.FX_DIAGNOSTICS == 'ON' }}
        timeout-minutes: 3
        shell: powershell
        run: |
          $failed = 'suite-out\ctest\LastTestsFailed.log'
          if ((Test-Path $failed) -and (Select-String -Path $failed -Pattern '^\d+:suite_fx_processor_tests$' -Quiet)) {
            & .github\scripts\Capture-FxProcessorException.ps1 -BuildDir build-suite -OutputDir suite-diagnostic
          }

      - name: Upload FX processor crash diagnostics
        if: ${{ failure() && steps.suite-ctest.outcome == 'failure' && env.FX_DIAGNOSTICS == 'ON' }}
        uses: actions/upload-artifact@v4
        with:
          name: VOX-FX-Processor-Diagnostic
          path: suite-diagnostic
          if-no-files-found: ignore
          retention-days: 7

      - name: Steinberg VST3 validator
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path suite-out\validator | Out-Null
          $failed = @()
          foreach ($bundle in Get-ChildItem build-suite\products\*_artefacts\Release\VST3\*.vst3 -Directory) {
            $log = Join-Path 'suite-out\validator' "$($bundle.BaseName).txt"
            & $env:VST3_VALIDATOR $bundle.FullName *> $log
            $code = $LASTEXITCODE
            Get-Content $log | Select-String -Pattern 'Result:|ERROR' | ForEach-Object { "$($bundle.Name): $_" }
            if ($code -ne 0) { $failed += $bundle.Name }
          }
          if ($failed.Count -gt 0) { throw "VST3 validator failed: $($failed -join ', ')" }

      - name: Record binaries and environment
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path suite-out\VST3 | Out-Null
          $lines = @(
            "Commit: $env:GITHUB_SHA",
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Runner: $env:RUNNER_NAME",
            "JUCE: $env:JUCE_COMMIT",
            "VST3 SDK (validator): $env:VST3SDK_TAG $env:VST3SDK_COMMIT"
          )
          foreach ($bundle in Get-ChildItem build-suite\products\*_artefacts\Release\VST3\*.vst3 -Directory -ErrorAction SilentlyContinue) {
            Copy-Item -Recurse -Force $bundle.FullName suite-out\VST3\
            foreach ($file in Get-ChildItem $bundle.FullName -Recurse -File) {
              $relative = $file.FullName.Substring($bundle.Parent.FullName.Length + 1)
              $lines += "SHA-256 $relative : $((Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower())"
            }
          }
          $lines | Set-Content suite-out\manifest.txt
          Get-Content suite-out\manifest.txt

      - name: Upload suite bundles and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VOX-Suite-VST3
          path: suite-out
          if-no-files-found: error

  # Explicit, single-test Windows reproduction. Trigger only by adding
  # [RUN_FX_PROCESSOR] to Draft PR #156 body; never on push/synchronize.
  windows-fx-processor-triage:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.action == 'edited' &&
        github.event.pull_request.number == 156 &&
        github.event.pull_request.draft &&
        github.head_ref == 'arena/d9776bd9-vox-electronic-engine' &&
        github.event.changes.body.from != null &&
        !contains(github.event.changes.body.from, '[RUN_FX_PROCESSOR]') &&
        contains(github.event.pull_request.body, '[RUN_FX_PROCESSOR]')
      }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      JUCE_COMMIT: e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8
      VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0
      HISTORICAL_FX_HEAD: e08eb314f6da27f877c0544a836e3bf8aec6207c
    steps:
      - name: Checkout diagnostic tools from current PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact failed FX source snapshot
        uses: actions/checkout@v4
        with:
          ref: e08eb314f6da27f877c0544a836e3bf8aec6207c
          path: fx-historic
          persist-credentials: false

      - name: Resolve pinned JUCE and VST3 dependencies
        run: |
          $juce = & .github\scripts\Use-PinnedCheckout.ps1 -Name juce -Repository 'https://github.com/juce-framework/JUCE.git' -Ref 9.0.1 -Commit $env:JUCE_COMMIT
          if (-not $juce) { exit 1 }
          $sdk = & .github\scripts\Use-PinnedCheckout.ps1 -Name vst3sdk -Repository 'https://github.com/steinbergmedia/vst3sdk.git' -Ref v3.8.0_build_66 -Commit $env:VST3SDK_COMMIT -Submodules base,pluginterfaces,public.sdk,cmake
          if (-not $sdk) { exit 1 }
          "JUCE_DIR=$juce" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VST3SDK_DIR=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure historical Release test with PDB symbols
        run: |
          cmake -S fx-historic -B fx-historic/build-triage -A x64 -DVOX_BUILD_SUITE=ON -DVOX_BUILD_LEGACY=OFF -DVOX_STRICT_DEPENDENCIES=ON "-DFETCHCONTENT_SOURCE_DIR_JUCE=$env:JUCE_DIR" "-DCMAKE_CXX_FLAGS_RELEASE:STRING=/O2 /Ob2 /DNDEBUG /Zi" "-DCMAKE_EXE_LINKER_FLAGS_RELEASE:STRING=/INCREMENTAL:NO /DEBUG:FULL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build ONLY the failed FX processor test and dependencies
        id: build
        run: |
          cmake --build fx-historic/build-triage --config Release --target suite_fx_processor_tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run ONLY historical suite_fx_processor_tests
        id: targeted
        run: |
          New-Item -ItemType Directory -Force -Path fx-triage | Out-Null
          $junit = Join-Path (Resolve-Path fx-triage).Path 'results.xml'
          # Keep the native exit status; the always() step preserves CTest text separately.
          ctest --test-dir fx-historic/build-triage -C Release -R '^suite_fx_processor_tests$' '--no-tests=error' --output-on-failure --output-junit $junit -VV
          exit $LASTEXITCODE

      - name: Capture the exact test exception under installed x64 CDB
        # Without a status function Actions adds success(), so a failed
        # targeted test would skip the very step that captures the crash.
        if: ${{ failure() && !cancelled() && steps.targeted.outcome == 'failure' }}
        timeout-minutes: 4
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\Capture-FxProcessorException.ps1'
          $output = Join-Path $env:GITHUB_WORKSPACE 'fx-triage\capture'
          Push-Location fx-historic
          try { & $helper -BuildDir build-triage -OutputDir $output -TimeoutSeconds 100 }
          finally { Pop-Location }

      - name: Preserve targeted CTest output and historical binary provenance
        if: ${{ always() }}
        run: |
          New-Item -ItemType Directory -Force -Path fx-triage | Out-Null
          $lines = @("Source SHA intended: $env:HISTORICAL_FX_HEAD", "Job SHA: $env:GITHUB_SHA", "Run: $env:GITHUB_RUN_ID", "This executable was rebuilt with /Zi and /DEBUG:FULL; it is NOT the byte-identical original failing EXE.")
          if (Test-Path fx-historic/.git) {
            $lines += "Historical source checkout: $(& git -C fx-historic rev-parse HEAD)"
            $lines += "Historical source tree: $(& git -C fx-historic rev-parse 'HEAD^{tree}')"
          }
          $temp = 'fx-historic\build-triage\Testing\Temporary'
          if (Test-Path $temp) {
            Get-ChildItem $temp -File -Filter '*Test*.log' | Copy-Item -Destination fx-triage -ErrorAction SilentlyContinue
          }
          $exe = Get-ChildItem 'fx-historic\build-triage\tests\suite' -Filter 'suite_fx_processor_tests.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            $lines += "Rebuilt EXE SHA-256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            Copy-Item $exe.FullName fx-triage
            $pdb = [System.IO.Path]::ChangeExtension($exe.FullName, '.pdb')
            if (Test-Path $pdb) {
              $lines += "Rebuilt PDB SHA-256: $((Get-FileHash $pdb -Algorithm SHA256).Hash.ToLowerInvariant())"
              Copy-Item $pdb fx-triage
            }
          }
          $lines | Set-Content fx-triage/provenance.txt
          $lines | ForEach-Object { Write-Host $_ }

      - name: Upload single-test CTest, CDB, PDB and dump evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: VOX-FX-Processor-Triage-Historical
          path: fx-triage
          if-no-files-found: error
          retention-days: 7

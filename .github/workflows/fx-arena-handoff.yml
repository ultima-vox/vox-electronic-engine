name: FX Arena draft handoff

# Lightweight GitHub API-only discovery; NO Windows runners, no checkout,
# no code execution from Arena branches, and no automatic merge.
on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fx-arena-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-draft-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Detect eligible FX Arena branch and prepare one Draft PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const base = 'next/fx-development';
            const head = context.ref.replace(/^refs\/heads\//, '');
            const markerPath = 'docs/ultima-vox-music/fx/ARENA_SYNC.md';
            const marker = '<!-- FX_ARENA_HANDOFF_V1 -->';
            const describe = msg => core.info('FX Arena handoff: ' + msg);

            if (!head.startsWith('arena/')) {
              describe('not an Arena branch; no action.');
              return;
            }

            async function hasOriginMarker(ref) {
              try {
                const response = await github.rest.repos.getContent({
                  owner, repo, path: markerPath, ref
                });
                const file = response.data;
                if (!file || Array.isArray(file) || file.type !== 'file' || !file.content) return false;
                const text = Buffer.from(file.content.replace(/\s/g, ''), 'base64').toString('utf8');
                return text.startsWith(marker);
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            // Old Arena or Design branches must not be auto-enrolled.
            if (!(await hasOriginMarker(head))) {
              describe('branch lacks FX origin marker; no action.');
              return;
            }

            let comparison;
            try {
              const response = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${base}...${head}`
              });
              comparison = response.data;
            } catch (error) {
              if (error.status === 404) {
                core.setFailed('FX integration branch or Arena branch disappeared; no PR opened.');
                return;
              }
              throw error;
            }

            const mergeBase = comparison.merge_base_commit?.sha;
            if (!mergeBase || !(await hasOriginMarker(mergeBase))) {
              describe('merge base predates FX Arena workflow; do not open an unrelated PR.');
              return;
            }

            if (comparison.ahead_by < 1 ||
                comparison.status === 'identical' ||
                comparison.status === 'behind') {
              describe('no additional Arena commits to hand off.');
              return;
            }

            const existing = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${head}`, per_page: 100
            });
            if (existing.length > 0) {
              describe('existing open PR #' + existing.map(pr => pr.number).join(', #') +
                '; do not create duplicates or retarget an existing PR.');
              return;
            }

            const title = `FX Arena handoff: ${head}`;
            const body = [
              '## Automated FX Arena checkpoint (DRAFT)',
              '',
              `Source: \`${head}\` · Target: \`${base}\`.`,
              `Detected Arena HEAD: \`${context.sha}\`.`,
              '',
              'This is a **review queue entry**, NOT a merge approval or Windows qualification.',
              'No automatic merge, rebase, cherry-pick, code sync or release is authorized.',
              '',
              '### TL checklist',
              '- [ ] Check exact branch ancestry, scope, diff and conflicts with other Arena sessions.',
              '- [ ] Review DSP realtime safety, state/preset compatibility, export paths and tests.',
              '- [ ] Confirm content/listening claims independently, and check open FX release gates.',
              '- [ ] Merge or cherry-pick selected changes into next/fx-development only after review.',
              '',
              'Heavy Windows jobs are deliberately skipped for this FX Draft PR.',
              'For a one-time exact-head Windows suite run, use the opt-in marker documented in ARENA_SYNC.md in a later PR-body edit.',
              'The initial GitHub-token PR creation may not trigger standard pull_request CI.',
              '',
              'Policy: docs/ultima-vox-music/fx/ARENA_SYNC.md'
            ].join('\n');

            try {
              const created = await github.rest.pulls.create({
                owner, repo, base, head, title, body, draft: true,
                maintainer_can_modify: true
              });
              describe('created Draft PR #' + created.data.number + ': ' + created.data.html_url);
              await core.summary
                .addHeading('FX Arena Draft handoff')
                .addLink('Draft PR #' + created.data.number, created.data.html_url)
                .addRaw(' · Base: ' + base + ' · Head: ' + head)
                .write();
            } catch (error) {
              if (error.status === 422) {
                const found = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open', head: `${owner}:${head}`, per_page: 100
                });
                if (found.length > 0) {
                  describe('PR already exists (creation raced); #' +
                    found.map(pr => pr.number).join(', #'));
                  return;
                }
              }
              if (error.status === 403) {
                core.setFailed(
                  'Draft PR creation forbidden (403). In repository Settings > Actions > General, ' +
                  'verify workflow token write permissions and "Allow GitHub Actions to create and approve pull requests". ' +
                  'No automatic merge was attempted.'
                );
                return;
              }
              throw error;
            }

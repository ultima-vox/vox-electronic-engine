name: FX-T18 restricted Windows x64 smoke (348bb2c r2)

# One-shot, owner-authorized FX-T18 smoke. This workflow is isolated from PR
# #170, and ONLY fires when this exact workflow file is initially pushed
# to this one-off CI branch. No manual or scheduled triggers.
on:
  push:
    branches:
      - ci/fx-t18-smoke-348bb2c-r2
    paths:
      - .github/workflows/fx-t18-restricted-smoke.yml

permissions:
  contents: read

concurrency:
  group: fx-t18-restricted-smoke-348bb2c
  cancel-in-progress: false

jobs:
  fx-typical-only:
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    steps:
      - name: Checkout exact owner-reviewed source (not workflow commit)
        uses: actions/checkout@v4
        with:
          ref: 348bb2c807b3abd7ca75efc7b4a8e5bd8f007d8b
          persist-credentials: false

      - name: Verify exact SHA, clean checkout, Windows PS5.1 and tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '348bb2c807b3abd7ca75efc7b4a8e5bd8f007d8b'
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) { throw "Unexpected source HEAD: $actual" }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if (@($dirty | Where-Object { $_ }).Count -gt 0) { throw "Dirty checkout: $($dirty -join '; ')" }
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1, found $($PSVersionTable.PSVersion)" }
          foreach ($tool in 'cmake', 'ctest', 'python', 'git') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Required tool unavailable: $tool" }
          }
          New-Item -ItemType Directory -Force t18-smoke-out | Out-Null
          @("source_head=$actual", "source_tree=$((& git rev-parse 'HEAD^{tree}').Trim())",
            "runner=$env:RUNNER_NAME", "machine=$env:COMPUTERNAME",
            "powershell=$($PSVersionTable.PSVersion)", "mode=typical-only",
            "scope=no full matrix; no main/PR merge; no retries") |
            Out-File -LiteralPath t18-smoke-out\provenance.txt -Encoding UTF8 -Width 4096

      - name: Resolve pinned clean JUCE (no VST3 validator)
        shell: powershell
        env:
          JUCE_COMMIT: e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8
        run: |
          $ErrorActionPreference = 'Stop'
          $juce = & .github\scripts\Use-PinnedCheckout.ps1 -Name juce -Repository 'https://github.com/juce-framework/JUCE.git' -Ref '9.0.1' -Commit $env:JUCE_COMMIT
          if (-not $juce) { throw 'Pinned JUCE checkout failed' }
          $actual = (& git -C $juce rev-parse HEAD).Trim()
          if ($actual -cne $env:JUCE_COMMIT) { throw "JUCE SHA mismatch: $actual" }
          $dirty = @(git -C $juce status --porcelain=v1 --untracked-files=all)
          if (@($dirty | Where-Object { $_ }).Count -gt 0) { throw 'JUCE checkout is dirty' }
          "JUCE_DIR=$juce" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append
          "juce_commit=$actual" | Out-File -LiteralPath t18-smoke-out\provenance.txt -Encoding UTF8 -Append

      - name: PowerShell 5.1 regression fixture (no test execution)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File docs\ultima-vox-music\fx\evidence\test-fx-t18-powershell.ps1 -Python python 2>&1 |
            Out-File -LiteralPath t18-smoke-out\ps51-fixtures.txt -Encoding UTF8 -Width 4096
          if ($LASTEXITCODE -ne 0) { Get-Content -LiteralPath t18-smoke-out\ps51-fixtures.txt; throw "PS5.1 fixture failed: $LASTEXITCODE" }

      - name: Configure and build ONLY the FX runtime stress target (Release x64)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path -LiteralPath build-t18) { Remove-Item -LiteralPath build-t18 -Recurse -Force }
          & cmake -S . -B build-t18 -A x64 -DVOX_BUILD_SUITE=ON -DVOX_BUILD_LEGACY=OFF -DVOX_STRICT_DEPENDENCIES=ON "-DFETCHCONTENT_SOURCE_DIR_JUCE=$env:JUCE_DIR" 2>&1 |
            Out-File -LiteralPath t18-smoke-out\configure.txt -Encoding UTF8 -Width 4096
          $configureExit = $LASTEXITCODE
          if ($configureExit -ne 0) { throw "FX-only configure failed: $configureExit" }
          & cmake --build build-t18 --config Release --clean-first --target suite_fx_runtime_stress_tests --parallel 2>&1 |
            Out-File -LiteralPath t18-smoke-out\build.txt -Encoding UTF8 -Width 4096
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { throw "FX runtime stress target build failed: $buildExit" }
          $dirty = @(git status --porcelain=v1 --untracked-files=all | Where-Object { $_ -notmatch '^\?\? t18-smoke-out/' })
          if (@($dirty | Where-Object { $_ }).Count -gt 0) { throw "Unexpected source change: $($dirty -join '; ')" }

      - name: Windows PS5.1 real CTest inventory to Python auditor (no tests)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File docs\ultima-vox-music\fx\evidence\test-fx-t18-powershell.ps1 -Python python -CtestBuildDir build-t18 2>&1 |
            Out-File -LiteralPath t18-smoke-out\ps51-real-inventory.txt -Encoding UTF8 -Width 4096
          if ($LASTEXITCODE -ne 0) { Get-Content -LiteralPath t18-smoke-out\ps51-real-inventory.txt; throw "PS5.1/CTest inventory audit failed: $LASTEXITCODE" }

      - name: ONE typical-only CTest and FULL TSV/provenance audit, bounded 180s
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = (Resolve-Path -LiteralPath t18-smoke-out).Path
          $report = Join-Path $out 'typical.tsv'
          $inventory = Join-Path $out 'typical.inventory.json'
          $junit = Join-Path $out 'typical.junit.xml'
          $raw = Join-Path $out 'typical.ctest.txt'
          $receiptPath = Join-Path $out 'typical.runner.json'
          $manifestPath = Join-Path $out 'typical.artifacts.json'
          $auditRaw = Join-Path $out 'typical.audit.txt'
          $auditJson = Join-Path $out 'typical.audit.json'
          $repo = (Get-Location).Path
          $expected = '348bb2c807b3abd7ca75efc7b4a8e5bd8f007d8b'
          $sourceHead = (& git rev-parse HEAD).Trim()
          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($sourceHead -cne $expected) { throw "Unexpected HEAD: $sourceHead" }
          if ($env:COMPUTERNAME -cne 'HAMUNAPTRA' -or
              @('1','2','3','4') -cnotcontains [string]$env:RUNNER_NAME) {
            throw "Allowed: runner services 1-4 on HAMUNAPTRA; observed $env:RUNNER_NAME/$env:COMPUTERNAME"
          }
          $dirty = @(git status --porcelain=v1 --untracked-files=all | Where-Object { $_ -and ($_ -notmatch '^\?\? t18-smoke-out/') })
          if ($dirty.Count -ne 0) { throw "Source changed during build: $($dirty -join '; ')" }
          $juceSha = (& git -C $env:JUCE_DIR rev-parse HEAD).Trim()
          if ($juceSha -cne 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8') { throw 'JUCE SHA mismatch' }
          $juceDirty = @(git -C $env:JUCE_DIR status --porcelain=v1 --untracked-files=all | Where-Object { $_ })
          if ($juceDirty.Count -ne 0) { throw 'JUCE checkout dirty' }
          & ctest --test-dir build-t18 -C Release -R '^suite_fx_runtime_stress_tests$' '--show-only=json-v1' 2>&1 |
            Out-File -LiteralPath $inventory -Encoding UTF8 -Width 4096
          if ($LASTEXITCODE -ne 0) { throw 'CTest inventory unavailable' }
          $obj = Get-Content -LiteralPath $inventory -Raw | ConvertFrom-Json
          $tests = @($obj.tests | Where-Object { $_.name -ceq 'suite_fx_runtime_stress_tests' })
          if ($tests.Count -ne 1) { throw "Expected exactly one FX test, got $($tests.Count)" }
          $exe = [string]$tests[0].command[0]
          if ($exe -notmatch '(?i)[\\/]Release[\\/]') { throw "Not a Release EXE: $exe" }
          $exe = (Resolve-Path -LiteralPath $exe).Path
          $sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          & python docs\ultima-vox-music\fx\evidence\audit-fx-windows-timing.py '--check-ctest-inventory' $inventory '--inventory-executable' $exe 2>&1 |
            Out-File -LiteralPath (Join-Path $out 'typical.inventory.audit.txt') -Encoding UTF8 -Width 4096
          if ($LASTEXITCODE -ne 0) { throw 'Selected EXE failed inventory auditor' }

          # Exact reviewed receipt before execution; its SHA is injected into the TSV.
          $receipt = [ordered]@{
            format = 'VOX_FX_T18_RUNNER_RECEIPT_V1'
            scenario = 'typical'
            source_head = $sourceHead
            source_tree = $sourceTree
            source_tracked_clean_before_build = $true
            source_tracked_clean_after_build = $true
            build_succeeded = $true
            build_config = 'Release'
            build_dir = [IO.Path]::GetFullPath('build-t18')
            configure_exit_code = 0
            build_exit_code = 0
            build_fresh_clean_first = $true
            configure_log_path = (Join-Path $out 'configure.txt')
            build_log_path = (Join-Path $out 'build.txt')
            ctest_timeout_seconds = 180
            ctest_inventory_path = $inventory
            ctest_junit_path = $junit
            ctest_selected_executable = $exe
            executable_path = $exe
            executable_sha256 = $sha256
            report_path = $report
            juce_dir = $env:JUCE_DIR
            juce_commit = $juceSha
            juce_tracked_clean = $true
            runner = $env:RUNNER_NAME
            machine = $env:COMPUTERNAME
            powershell = $PSVersionTable.PSVersion.ToString()
            created_utc = [DateTime]::UtcNow.ToString('o')
          }
          $receipt | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $receiptPath -Encoding UTF8
          $receiptSha = (Get-FileHash -LiteralPath $receiptPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Remove-Item Env:VOX_FX_STRESS_AUTHORED -ErrorAction SilentlyContinue
          $env:VOX_FX_STRESS_TYPICAL = '1'
          $env:VOX_FX_TIMING_THREAD_CPU = '1'
          $env:VOX_FX_SOURCE_SHA = $sourceHead
          $env:VOX_FX_SOURCE_TREE = $sourceTree
          $env:VOX_FX_EXECUTABLE = $exe
          $env:VOX_FX_EXE_SHA256 = $sha256
          $env:VOX_FX_RUNNER_RECEIPT_SHA256 = $receiptSha
          $env:VOX_FX_REPORT = $report
          & ctest --test-dir build-t18 -C Release -R '^suite_fx_runtime_stress_tests$' '--no-tests=error' '--timeout' 180 '--output-on-failure' '--output-junit' $junit '-VV' 2>&1 |
            Out-File -LiteralPath $raw -Encoding UTF8 -Width 4096
          $ctestCode = $LASTEXITCODE
          Write-Host "Single typical-only CTest exit: $ctestCode"

          @("source_head=$sourceHead", "source_tree=$sourceTree",
            "selected_exe=$exe", "exe_sha256=$sha256",
            "receipt_sha256=$receiptSha", "ctest_exit_code=$ctestCode",
            "runner=$env:RUNNER_NAME", "qualification=NOT_GRANTED") |
            Out-File -LiteralPath (Join-Path $out 'binary-receipt.txt') -Encoding UTF8 -Width 4096

          function New-ArtifactEntry([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return $null }
            return [ordered]@{
              path = [IO.Path]::GetFullPath($Path)
              sha256 = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $entries = @(
            New-ArtifactEntry $report
            New-ArtifactEntry $raw
            New-ArtifactEntry $junit
            New-ArtifactEntry $inventory
            New-ArtifactEntry $receiptPath
            New-ArtifactEntry $exe
            New-ArtifactEntry (Join-Path $out 'configure.txt')
            New-ArtifactEntry (Join-Path $out 'build.txt')
            New-ArtifactEntry (Join-Path $out 'ps51-fixtures.txt')
            New-ArtifactEntry (Join-Path $out 'ps51-real-inventory.txt')
          ) | Where-Object { $null -ne $_ }
          ([ordered]@{ format='VOX_FX_T18_ARTIFACTS_V1'; scenario='typical'; files=@($entries) }) |
            ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          & python docs\ultima-vox-music\fx\evidence\audit-fx-windows-timing.py $report '--root' $repo '--executable' $exe '--runner-receipt' $receiptPath '--artifact-manifest' $manifestPath '--expected-head' $sourceHead '--expected-tree' $sourceTree 2>&1 |
            Out-File -LiteralPath $auditRaw -Encoding UTF8 -Width 4096
          $auditCode = $LASTEXITCODE
          $perf = $null
          $insufficient = $null
          $attribution = $null
          if ($auditCode -eq 0) {
            Copy-Item -LiteralPath $auditRaw -Destination $auditJson
            try {
              $audited = Get-Content -LiteralPath $auditJson -Raw | ConvertFrom-Json
              $perf = [bool]$audited.performance_failure
              $insufficient = [bool]$audited.cpu_measurement_insufficient
              $attribution = [string]$audited.cpu_attribution
            } catch {
              $auditCode = 125
              Write-Host "Auditor returned non-JSON result: $_"
            }
          }
          $result = [ordered]@{
            source_head = $sourceHead
            source_tree = $sourceTree
            executable_sha256 = $sha256
            receipt_sha256 = $receiptSha
            ctest_exit_code = $ctestCode
            auditor_exit_code = $auditCode
            performance_failure = $perf
            cpu_measurement_insufficient = $insufficient
            cpu_attribution = $attribution
            qualification = 'diagnostic only'
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $out 'smoke-status.json') -Encoding UTF8
          Write-Host ($result | ConvertTo-Json -Depth 8)
          if ($auditCode -ne 0) {
            if (Test-Path $auditRaw) { Get-Content -LiteralPath $auditRaw -Tail 25 }
            throw "FULL TSV/provenance audit FAILED (exit $auditCode); evidence retained"
          }
          if ($perf) { throw 'REAL performance_failure detected; evidence retained' }
          if ($insufficient) { throw 'CPU_MEASUREMENT_INSUFFICIENT: blocking diagnostic, NOT PASS; evidence retained' }
          if ($ctestCode -ne 0) { throw "CTest exit $ctestCode; evidence retained" }
          Write-Host 'Typical-only diagnostics valid; no FX-T18/DAW qualification implied.'

      - name: Preserve all restricted smoke evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FX-T18-typical-full-audit-348bb2c-r2
          path: t18-smoke-out/
          if-no-files-found: warn
          retention-days: 3

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Collapse superseded PR builds while preserving pushes to main and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  choose-windows-runner:
    # The lightweight selector executes on GitHub-hosted Linux only when the
    # existing Windows job eligibility is satisfied.
    if: ${{ github.event_name != 'pull_request' || !(github.event.pull_request.draft && github.head_ref == 'arena/d9776bd9-vox-electronic-engine') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      route: ${{ steps.pick.outputs.route }}
    steps:
      - name: Select Windows runner
        id: pick
        uses: actions/github-script@v7
        env:
          HAS_RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN != '' }}
        with:
          github-token: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
          script: |
            const selfHosted = ['self-hosted', 'windows'];
            let runner = selfHosted;
            let reason = 'Status credential unavailable; use self-hosted';
            if (process.env.HAS_RUNNER_STATUS_TOKEN === 'true') {
              try {
                const runners = await github.paginate(
                  github.rest.actions.listSelfHostedRunnersForRepo,
                  {owner: context.repo.owner, repo: context.repo.repo, per_page: 100}
                );
                const idle = runners.filter(r => r.status === 'online' && r.busy === false &&
                  ['self-hosted', 'windows'].every(n =>
                    (r.labels || []).some(l => String(l.name).toLowerCase() === n)));
                if (idle.length === 0) {
                  runner = 'windows-2022';
                  reason = 'No online idle matching self-hosted Windows runner';
                } else {
                  reason = `${idle.length} online idle matching self-hosted Windows runner(s)`;
                }
              } catch (error) {
                core.warning(`Cannot query self-hosted runner inventory (HTTP ${error.status || 'unknown'}); keeping self-hosted`);
                reason = 'Inventory inaccessible; keep self-hosted';
              }
            } else {
              core.warning('RUNNER_STATUS_TOKEN missing: hosted fallback cannot activate');
            }
            core.setOutput('runner', JSON.stringify(runner));
            core.setOutput('route', Array.isArray(runner) ? 'self-hosted' : 'github-hosted');
            core.info(`Route: ${JSON.stringify(runner)}. ${reason}`);
            await core.summary.addHeading('Windows runner selection')
              .addTable([[{data:'Route',header:true},{data:'Reason',header:true}],
                         [Array.isArray(runner)?'self-hosted/windows':'windows-2022',reason]])
              .write();
  windows-vst3:
    needs: choose-windows-runner
    # FX draft PR — heavy Windows gate is manual until the integrated candidate.
    # All other PRs and main continue to build as before.
    if: ${{ github.event_name != 'pull_request' || !(github.event.pull_request.draft && github.head_ref == 'arena/d9776bd9-vox-electronic-engine') }}
    runs-on: ${{ fromJSON(needs.choose-windows-runner.outputs.runner) }}
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Infrastructure: FetchContent's JUCE clone broke off repeatedly on this
      # runner. Configure from a verified copy of the pinned JUCE 9.0.1 commit
      # in the runner tool cache; CMake re-verifies the commit.
      - name: Provide verified JUCE copy
        shell: powershell
        run: |
          $juce = & .github\scripts\Use-PinnedCheckout.ps1 -Name juce -Repository https://github.com/juce-framework/JUCE.git -Ref 9.0.1 -Commit e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8
          if (-not $juce) { exit 1 }
          "JUCE_DIR=$juce" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure
        shell: powershell
        run: |
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          $flag = if ($null -ne $nsis) { "ON" } else { "OFF" }
          cmake -S . -B build -A x64 "-DVOX_ENABLE_NSIS=$flag" "-DVOX_UI_BUILD_SHOWCASE=ON" -DVOX_BUILD_LEGACY=ON -DVOX_BUILD_SUITE=OFF -DVOX_STRICT_DEPENDENCIES=ON "-DFETCHCONTENT_SOURCE_DIR_JUCE=$env:JUCE_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build --config Release --clean-first --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Capture Visual Gate snapshots
        shell: powershell
        run: |
          $snapshotDir = Join-Path $PWD "build\visual-gate"
          New-Item -ItemType Directory -Force -Path $snapshotDir | Out-Null
          $capture = Join-Path $PWD "build\Release\vox_ui_visual_gate_capture.exe"
          if (-not (Test-Path $capture)) { throw "Visual Gate capture executable not found: $capture" }

          function Capture-VisualGate($file, $instrument, $page, $width, $height) {
            $output = Join-Path $snapshotDir $file
            & $capture $output $instrument $page $width $height
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path $output)) { throw "Visual Gate snapshot not created: $output" }
          }

          Capture-VisualGate "psy-bass-sound-1180x760.png" "com.ultimavox.psy-bass" "sound" 1180 760
          Capture-VisualGate "psy-bass-sound-1500x920.png" "com.ultimavox.psy-bass" "sound" 1500 920
          Capture-VisualGate "acid-sound-1500x920.png" "com.ultimavox.acid" "sound" 1500 920
          Capture-VisualGate "psy-bass-macros-1500x920.png" "com.ultimavox.psy-bass" "macros" 1500 920

      - name: Upload Visual Gate snapshots
        uses: actions/upload-artifact@v4
        with:
          name: Vox-UI-Visual-Gate
          path: build/visual-gate/*.png
          if-no-files-found: error

      - name: Package Vox Electronic Engine
        shell: powershell
        run: cmake --build build --config Release --target package

      - name: Upload VST3 and installer
        uses: actions/upload-artifact@v4
        with:
          name: Vox-Electronic-Engine-Windows
          path: |
            build/VstEngine_artefacts/Release/VST3/Vox Electronic Engine.vst3
            build/*.exe
            build/*.zip
          if-no-files-found: error

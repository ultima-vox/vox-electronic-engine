name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-vst3:
    runs-on: [self-hosted, windows]
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: powershell
        run: |
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          $flag = if ($null -ne $nsis) { "ON" } else { "OFF" }
          cmake -S . -B build -A x64 "-DVOX_ENABLE_NSIS=$flag" "-DVOX_UI_BUILD_SHOWCASE=ON"

      - name: Build
        run: cmake --build build --config Release --clean-first --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Capture Visual Gate snapshots
        shell: powershell
        run: |
          $snapshotDir = Join-Path $PWD "build\visual-gate"
          New-Item -ItemType Directory -Force -Path $snapshotDir | Out-Null
          $capture = Join-Path $PWD "build\Release\vox_ui_visual_gate_capture.exe"
          if (-not (Test-Path $capture)) { throw "Visual Gate capture executable not found: $capture" }

          function Capture-VisualGate($file, $instrument, $page, $width, $height) {
            $output = Join-Path $snapshotDir $file
            & $capture $output $instrument $page $width $height
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path $output)) { throw "Visual Gate snapshot not created: $output" }
          }

          # Capture actual shared Rack editor/utility components as well as the showcase.
          $env:VOX_UI_SNAPSHOT = Join-Path $snapshotDir "rack-shell-native-1240x800.png"
          $env:VOX_ROUTING_SNAPSHOT = Join-Path $snapshotDir "rack-routing-native-1040x780.png"
          $env:VOX_DUCKING_SNAPSHOT = Join-Path $snapshotDir "rack-ducking-native-1040x780.png"
          & (Join-Path $PWD "build\Release\editor_smoke_tests.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:VOX_UI_SNAPSHOT
          Remove-Item Env:VOX_ROUTING_SNAPSHOT
          Remove-Item Env:VOX_DUCKING_SNAPSHOT

          Capture-VisualGate "psy-bass-sound-1180x760.png" "com.ultimavox.psy-bass" "sound" 1180 760
          Capture-VisualGate "psy-bass-sound-1500x920.png" "com.ultimavox.psy-bass" "sound" 1500 920
          Capture-VisualGate "acid-sound-1500x920.png" "com.ultimavox.acid" "sound" 1500 920
          Capture-VisualGate "psy-bass-macros-1500x920.png" "com.ultimavox.psy-bass" "macros" 1500 920

      - name: Upload Visual Gate snapshots
        uses: actions/upload-artifact@v4
        with:
          name: Vox-UI-Visual-Gate
          path: build/visual-gate/*.png
          if-no-files-found: error

      - name: Upload test instrument module
        uses: actions/upload-artifact@v4
        with:
          name: Vox-Test-Instrument-Module-Windows
          path: |
            build/Release/vox_abi_v2_test_module.dll
            build/packages/**
          if-no-files-found: error

      - name: Upload Vox Demo Synth package
        uses: actions/upload-artifact@v4
        with:
          name: Vox-Demo-Synth-Package-Windows
          path: build/demo-packages/**
          if-no-files-found: error

      - name: Assemble Vox Demo Synth Cubase guide
        shell: powershell
        run: |
          $guide = Join-Path $PWD "build\demo-guide"
          if (Test-Path $guide) { Remove-Item -Recurse -Force $guide }
          New-Item -ItemType Directory -Force -Path $guide | Out-Null
          Copy-Item docs\testing\demo-synth\* $guide
          $rack = "build\VstEngine_artefacts\Release\VST3\Vox Electronic Engine.vst3\Contents\x86_64-win\Vox Electronic Engine.vst3"
          $dll = "build\demo-packages\com.ultimavox.demo-synth.voxinst\1.0.0\module\x64\VoxDemoSynth.dll"
          foreach ($f in @($rack, $dll)) { if (-not (Test-Path $f)) { throw "missing $f" } }
          @(
            "Commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Rack SHA-256: $((Get-FileHash -Algorithm SHA256 $rack).Hash.ToLower())"
            "VoxDemoSynth.dll SHA-256: $((Get-FileHash -Algorithm SHA256 $dll).Hash.ToLower())"
          ) | Set-Content (Join-Path $guide "build-info.txt")
          Get-Content (Join-Path $guide "build-info.txt")

      - name: Upload Vox Demo Synth Cubase guide
        uses: actions/upload-artifact@v4
        with:
          name: Vox-Demo-Synth-Cubase-Guide
          path: build/demo-guide/*
          if-no-files-found: error

      - name: Upload Full-on Drums package
        uses: actions/upload-artifact@v4
        with:
          name: Vox-FullOn-Drums-Package-Windows
          path: build/drums-packages/**
          if-no-files-found: error

      - name: Assemble Full-on Drums Cubase guide
        shell: powershell
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $guide = Join-Path $PWD "build\drums-guide"
          if (Test-Path $guide) { Remove-Item -Recurse -Force $guide }
          New-Item -ItemType Directory -Force -Path $guide | Out-Null
          Copy-Item docs\testing\fullon-drums\* $guide
          $rack = "build\VstEngine_artefacts\Release\VST3\Vox Electronic Engine.vst3\Contents\x86_64-win\Vox Electronic Engine.vst3"
          $dll = "build\drums-packages\com.ultimavox.fullon-drums.voxinst\0.1.0\module\x64\VoxFullOnDrums.dll"
          foreach ($f in @($rack, $dll)) { if (-not (Test-Path $f)) { throw "missing $f" } }
          @(
            "Head commit: $env:HEAD_SHA"
            "Built commit (PR merge ref): $env:GITHUB_SHA"
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Rack SHA-256: $((Get-FileHash -Algorithm SHA256 $rack).Hash.ToLower())"
            "VoxFullOnDrums.dll SHA-256: $((Get-FileHash -Algorithm SHA256 $dll).Hash.ToLower())"
          ) | Set-Content (Join-Path $guide "build-info.txt")
          Get-Content (Join-Path $guide "build-info.txt")

      - name: Upload Full-on Drums Cubase guide
        uses: actions/upload-artifact@v4
        with:
          name: Vox-FullOn-Drums-Cubase-Guide
          path: build/drums-guide/*
          if-no-files-found: error

      - name: Package Vox Electronic Engine
        shell: powershell
        run: cmake --build build --config Release --target package

      - name: Upload VST3 and installer
        uses: actions/upload-artifact@v4
        with:
          name: Vox-Electronic-Engine-Windows
          path: |
            build/VstEngine_artefacts/Release/VST3/Vox Electronic Engine.vst3
            build/*.exe
            build/*.zip
          if-no-files-found: error

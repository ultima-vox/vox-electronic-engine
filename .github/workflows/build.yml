name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-vst3:
    runs-on: [self-hosted, windows]
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: powershell
        run: |
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          $flag = if ($null -ne $nsis) { "ON" } else { "OFF" }
          cmake -S . -B build -A x64 "-DVOX_ENABLE_NSIS=$flag" "-DVOX_UI_BUILD_SHOWCASE=ON"

      - name: Build
        run: cmake --build build --config Release --clean-first --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Capture Visual Gate snapshots
        shell: powershell
        run: |
          $snapshotDir = Join-Path $PWD "build\visual-gate"
          New-Item -ItemType Directory -Force -Path $snapshotDir | Out-Null
          $capture = Join-Path $PWD "build\Release\vox_ui_visual_gate_capture.exe"
          if (-not (Test-Path $capture)) { throw "Visual Gate capture executable not found: $capture" }

          function Capture-VisualGate($file, $instrument, $page, $width, $height) {
            $output = Join-Path $snapshotDir $file
            & $capture $output $instrument $page $width $height
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path $output)) { throw "Visual Gate snapshot not created: $output" }
          }

          Capture-VisualGate "psy-bass-sound-1180x760.png" "com.ultimavox.psy-bass" "sound" 1180 760
          Capture-VisualGate "psy-bass-sound-1500x920.png" "com.ultimavox.psy-bass" "sound" 1500 920
          Capture-VisualGate "acid-sound-1500x920.png" "com.ultimavox.acid" "sound" 1500 920
          Capture-VisualGate "psy-bass-macros-1500x920.png" "com.ultimavox.psy-bass" "macros" 1500 920

      - name: Upload Visual Gate snapshots
        uses: actions/upload-artifact@v4
        with:
          name: Vox-UI-Visual-Gate
          path: build/visual-gate/*.png
          if-no-files-found: error

      - name: Package Vox Electronic Engine
        shell: powershell
        run: cmake --build build --config Release --target package

      - name: Upload VST3 and installer
        uses: actions/upload-artifact@v4
        with:
          name: Vox-Electronic-Engine-Windows
          path: |
            build/VstEngine_artefacts/Release/VST3/Vox Electronic Engine.vst3
            build/*.exe
            build/*.zip
          if-no-files-found: error

  windows-fullon-bass-v2:
    # Experimental ABI proof; independent from the product VST3 packaging job.
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Bass source
        uses: actions/checkout@v4
      - name: Checkout canonical Rack ABI for adapter test
        uses: actions/checkout@v4
        with:
          ref: 5f3818dea1dd2e1971058010aafb3ff570822ac2
          path: _vox_abi_v2
      - name: Configure Bass DLL
        shell: powershell
        run: |
          $abiRoot = Join-Path $env:GITHUB_WORKSPACE "_vox_abi_v2/libs"
          # Keep JUCE's deeply nested source paths below Windows' legacy path limit.
          $depsRoot = Join-Path $env:RUNNER_TEMP "bass-deps-${{ github.run_id }}-${{ github.run_attempt }}"
          cmake -S . -B build-bass-v2 -G "Visual Studio 17 2022" -A x64 "-DFETCHCONTENT_BASE_DIR=$depsRoot" "-DVOX_BUILD_FULLON_BASS_MODULE=ON" "-DVOX_MODULE_ABI_V2_ROOT=$abiRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Bass DLL and ABI test
        id: bass_build
        run: cmake --build build-bass-v2 --config Release --target fullon_bass_module_tests --parallel
      - name: Test Bass ABI DLL round trip
        run: ctest --test-dir build-bass-v2 -C Release -R "^fullon_bass_module_tests$" --output-on-failure
      - name: Upload experimental Bass DLL
        if: always() && steps.bass_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VoxFullOnBass-Windows-ABI-prototype
          path: build-bass-v2/Release/VoxFullOnBass.dll
          if-no-files-found: error

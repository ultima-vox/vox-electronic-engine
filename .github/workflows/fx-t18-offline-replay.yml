name: FX-T18 Offline Replay (one shot)
on:
  push:
    branches: [ops/fx-t18-offline-replay-20261126]
    paths: ['.github/workflows/fx-t18-offline-replay.yml']
permissions:
  contents: read
concurrency:
  group: fx-t18-offline-replay-20261126
  cancel-in-progress: false
jobs:
  replay:
    if: github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Verify target host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ine 'HAMUNAPTRA') { throw 'BLOCKED: unexpected host' }
      - uses: actions/checkout@v4
        with:
          ref: 6c364442de8fc355ad42b6c6ec17843a02662240
          persist-credentials: false
      - name: Offline replay (sanitized)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '6c364442de8fc355ad42b6c6ec17843a02662240') { throw 'BLOCKED: parser checkout mismatch' }
          $source = @'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile

          def stop(category):
              print("BLOCKED: " + category, flush=True)
              sys.exit(2)

          def sha(p):
              with p.open("rb") as f:
                  h = hashlib.sha256()
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
                  return h.hexdigest()

          def json_read(p):
              return json.loads(p.read_text(encoding="utf-8-sig"))

          def receipt(p):
              head = p.read_text(encoding="utf-8-sig").split("--- RAW OUTPUT ---", 1)
              if len(head) != 2:
                  stop("invalid control receipt")
              values = {}
              for line in head[0].splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      if k in values:
                          stop("duplicate control receipt key")
                      values[k] = v.strip()
              return values

          def main():
              if os.environ.get("COMPUTERNAME", "").casefold() != "hamunaptra":
                  stop("unexpected host")
              local = os.environ.get("LOCALAPPDATA")
              if not local:
                  stop("runner LOCALAPPDATA unavailable")
              folder = pathlib.Path(local) / "VOX-FX-T18-369c0260e26e464597c76a14bda84dcd"
              expected = {
                  "compat.etl": "62cdd65243a2f49f495dc59172eef3516776ec750a8f271b1a6003a2cea5dbe0",
                  "tracerpt-output.xml": "440c973a01723ba85057aa4f721ce68a6364c2fa8a44eca92dec35b5a783e08d",
                  "tracerpt-summary.txt": "0a637c899b2806d6928f8f571fe6a204e495a88fb415326b2ec950bda8fb915a",
              }
              if not folder.is_dir() or folder.is_symlink():
                  stop("exact owner evidence directory unavailable to runner")
              names = list(expected) + ["controlled-process.json", "diagnostic-summary.json", "logman-stop.txt", "logman-post-stop-query.txt"]
              paths = {n: folder / n for n in names}
              if any(not p.is_file() or p.is_symlink() for p in paths.values()):
                  stop("required evidence unavailable")
              before = {n: sha(p) for n, p in paths.items()}
              if any(before[n] != v for n, v in expected.items()):
                  stop("original input hash mismatch")
              original = json_read(paths["diagnostic-summary.json"])
              for field, name in [("etl_sha256", "compat.etl"), ("decoded_xml_sha256", "tracerpt-output.xml"), ("tracerpt_summary_sha256", "tracerpt-summary.txt"), ("controlled_process_receipt_sha256", "controlled-process.json")]:
                  if original.get(field) != before[name]:
                      stop("original diagnostic receipt hash mismatch")
              stop_record = receipt(paths["logman-stop.txt"])
              query_record = receipt(paths["logman-post-stop-query.txt"])
              stop_match = re.fullmatch(r"stop (VOX-FX-T18-[A-Za-z0-9-]+) -ets", stop_record.get("arguments", ""), re.I)
              query_match = re.fullmatch(r"query (VOX-FX-T18-[A-Za-z0-9-]+) -ets", query_record.get("arguments", ""), re.I)
              if not stop_match or not query_match or stop_match[1] != query_match[1]:
                  stop("session binding unavailable")
              if stop_record.get("exit_code") != "0" or original.get("stop_exit_code") != 0:
                  stop("stop receipt not successful")
              code = int(query_record.get("exit_code", "0"), 10)
              if code not in (-2144337918, 0x80300002) or original.get("post_stop_query_exit_code") != code or original.get("post_stop_active_marker") is not False:
                  stop("cleanup HRESULT not verified")
              print("original_hashes_verified=true; original_cleanup_hresult_verified=true", flush=True)
              parser = pathlib.Path("docs/ultima-vox-music/fx/evidence/parse-fx-t18-etl.py")
              with tempfile.TemporaryDirectory(prefix="fx-t18-offline-") as temporary:
                  output = pathlib.Path(temporary) / "report.json"
                  command = [sys.executable, str(parser), "--etl", str(paths["compat.etl"]), "--diagnostic-decoded-xml", str(paths["tracerpt-output.xml"]), "--diagnostic-summary", str(paths["tracerpt-summary.txt"]), "--diagnostic-controlled-process", str(paths["controlled-process.json"]), "--diagnostic-output", str(output)]
                  result = subprocess.run(command, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=90, check=False)
                  if before != {n: sha(p) for n, p in paths.items()}:
                      stop("input integrity changed")
                  print("parser_exit_code=" + str(result.returncode), flush=True)
                  reason = result.stderr.decode("utf-8", errors="replace")
                  categories = [
                      ("controlled process PID/creation-time binding failed", "controlled lifecycle binding failed"),
                      ("controlled-process receipt format is not supported", "controlled receipt format rejected"),
                      ("controlled-process receipt PID is invalid", "controlled receipt PID invalid"),
                      ("controlled-process receipt does not prove a clean timeout exit", "controlled receipt exit invalid"),
                      ("requires the retained controlled-process receipt", "controlled receipt unavailable"),
                      ("Events Lost/Buffers Lost counters are absent", "loss-counter fields absent"),
                  ]
                  categories += [
                      ("tracerpt process event has an ambiguous System block", "tracerpt process event has an ambiguous System block"),
                      ("tracerpt process event provider identity is ambiguous", "tracerpt process event provider identity is ambiguous"),
                      ("tracerpt process event provider Name/Guid identity contradicts", "tracerpt process event provider Name/Guid identity contradicts"),
                      ("tracerpt process event has an ambiguous EventID", "tracerpt process event has an ambiguous EventID"),
                      ("tracerpt process event has an ambiguous Version/Opcode", "tracerpt process event has an ambiguous Version/Opcode"),
                      ("tracerpt process event Version/Opcode contradicts its EventID", "tracerpt process event Version/Opcode contradicts its EventID"),
                      ("tracerpt process event lacks CreateTime", "tracerpt process event lacks CreateTime"),
                      ("tracerpt process-start event lacks ImageName or ParentProcessID", "tracerpt process-start event lacks ImageName or ParentProcessID"),
                      ("tracerpt process-start event has an empty ImageName", "tracerpt process-start event has an empty ImageName"),
                      ("tracerpt process-stop event has no matching start identity", "tracerpt process-stop event has no matching start identity"),
                      ("tracerpt process-stop ImageName disagrees with its start event", "tracerpt process-stop ImageName disagrees with its start event"),
                      ("tracerpt process-stop ParentProcessID disagrees with its start event", "tracerpt process-stop ParentProcessID disagrees with its start event"),
                      ("tracerpt process-stop event has incomplete process identity", "tracerpt process-stop event has incomplete process identity"),
                      ("tracerpt events fall outside the independently derived summary coverage", "tracerpt events fall outside the independently derived summary coverage"),
                      ("compatibility diagnostic requires the retained controlled-process receipt", "compatibility diagnostic requires the retained controlled-process receipt"),
                      ("controlled-process receipt format is not supported", "controlled-process receipt format is not supported"),
                      ("controlled-process receipt PID is invalid", "controlled-process receipt PID is invalid"),
                      ("controlled-process receipt does not prove a clean timeout exit", "controlled-process receipt does not prove a clean timeout exit"),
                      ("compatibility diagnostic requires retained ETL, XML, summary and controlled-process artifacts", "compatibility diagnostic requires retained ETL, XML, summary and controlled-process artifacts"),
                      ("decoded process events are not monotonic", "decoded process events are not monotonic"),
                      ("has an invalid process identity", "has an invalid process identity"),
                      ("is missing timestamp_utc", "is missing timestamp_utc"),
                      ("is missing start_time_utc", "is missing start_time_utc"),
                      ("is missing ProcessId", "is missing ProcessId"),
                      ("ProcessId is not an integer", "ProcessId is not an integer"),
                      ("ParentId is not an integer", "ParentId is not an integer"),
                      ("tracerpt event has no provider timestamp", "tracerpt event has no provider timestamp"),
                      ("tracerpt process creation time is not an ISO timestamp or Windows FILETIME", "tracerpt process creation time is not an ISO timestamp or Windows FILETIME"),
                      ("tracerpt event time is not an ISO timestamp or Windows FILETIME", "tracerpt event time is not an ISO timestamp or Windows FILETIME"),
                      ("timestamp has no UTC offset", "timestamp has no UTC offset"),
                      ("timestamp has more than seven fractional-second digits", "timestamp has more than seven fractional-second digits"),
                      ("Invalid isoformat string", "Invalid isoformat string"),
                      ("is not an ISO timestamp or Windows FILETIME", "is not an ISO timestamp or Windows FILETIME"),
                      ("Windows FILETIME is out of range", "Windows FILETIME is out of range"),
                      ("negative Windows FILETIME", "negative Windows FILETIME"),
                      ("is not a strict non-negative integer", "is not a strict non-negative integer"),
                      ("tracerpt summary coverage interval is not positive", "tracerpt summary coverage interval is not positive"),
                      ("counters contradict", "counters contradict"),
                  ]
                  categories.append(("has nonzero sub-100ns timestamp digits", "nonzero sub-100ns timestamp digits"))
                  categories += [(x, x) for x in ("tracerpt process events are not monotonic", "tracerpt process-start identity is duplicated", "controlled process stop has no matching start identity", "tracerpt process-stop identity has a later matching start")]
                  failure_category = next((category for marker, category in categories if marker in reason), "parser rejected retained evidence")
                  if not output.is_file():
                      print("diagnostic_report_present=false", flush=True)
                      if failure_category == "parser rejected retained evidence" and "EventTrace" in reason:
                          failure_category = "EventTrace header identity or fields rejected"
                      stop(failure_category if result.returncode else "parser report missing")
                  print("diagnostic_report_present=true", flush=True)
                  report = json_read(output)
                  required = {"controlled_process_binding_valid": True, "controlled_start_match_count": 1, "controlled_stop_match_count": 1, "controlled_lifecycle_order_valid": True, "lost_events": 0, "buffer_loss_events": 0, "buffers_written": 6, "max_file_size_mb": 16, "log_file_mode": 0, "qualification_prohibited": True, "diagnostic_only": True, "production_receipt_created": False}
                  required.update({"process_start_events": 5, "process_stop_events": 4, "events_received": 9, "summary_buffers_processed": 6, "summary_events_processed": 11})
                  required.update({"observed_process_events": 9, "observed_process_start_events": 5, "observed_process_stop_events": 4, "reconciled_process_events": 8, "reconciled_process_start_events": 5, "reconciled_process_stop_events": 3, "unmatched_process_event_count": 1, "unmatched_process_stop_count": 1, "unmatched_controlled_event_count": 0, "controlled_pid_start_event_count": 1, "controlled_pid_stop_event_count": 1})
                  extra_counts = []
                  for k in list(required) + extra_counts:
                      actual = report.get(k)
                      print(k + "=" + (json.dumps(actual) if type(actual) in (int, bool) else "missing_or_invalid"), flush=True)
                  header = report.get("eventtrace_header", {})
                  header_valid = header.get("opcode") == "Header" and type(header.get("version")) is int and header["version"] in (0, 2)
                  hashes_valid = all(report.get(field) == before[name] for field, name in [("raw_etl_sha256", "compat.etl"), ("decoded_xml_sha256", "tracerpt-output.xml"), ("summary_sha256", "tracerpt-summary.txt"), ("controlled_process_receipt_sha256", "controlled-process.json")])
                  print("input_integrity_unchanged=true", flush=True)
                  print("parser_hashes_verified=" + json.dumps(hashes_valid), flush=True)
                  print("header_identity_verified=" + json.dumps(header_valid), flush=True)
                  if not hashes_valid or not header_valid:
                      stop("parser report integrity or header mismatch")
                  if result.returncode != 0:
                      stop(failure_category)
                  if any(type(report.get(k)) != type(v) or report.get(k) != v for k, v in required.items()):
                      stop("diagnostic result mismatch")
                  print("OFFLINE_REPLAY_PASS; qualification_prohibited=true")

          try:
              main()
          except Exception:
              stop("local evidence access or processing failure")
          '@
          $source | python -
          if ($LASTEXITCODE -ne 0) { throw 'Offline replay blocked; see sanitized output' }

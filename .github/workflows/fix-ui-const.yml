name: one-shot-ui-const-fix

on:
  push:
    branches:
      - feat/ui-instrument-workspaces
    paths:
      - .github/workflows/fix-ui-const.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-instrument-workspaces
          fetch-depth: 0
      - name: Apply exact matrix const fix
        shell: powershell
        run: |
          $path = "apps/vst3/PluginEditor.cpp"
          $text = Get-Content -Raw $path
          $old = "const auto rr = juce::Rectangle<int>"
          $new = "auto rr = juce::Rectangle<int>"
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one matrix const occurrence, found $count" }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          git diff --exit-code --quiet -- $path
          if ($LASTEXITCODE -eq 0) { throw "Patch produced no diff" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $path
          git commit -m "fix(ui): allow matrix row slicing"
          git push origin HEAD:feat/ui-instrument-workspaces
